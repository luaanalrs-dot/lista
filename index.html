*{box-sizing:border-box;margin:0}
body{font-family:"Space Mono",monospace;color:var(--cream);font-size:14px;line-height:1.5}



button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:2px 0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.pill{border:1px solid var(--gold);color:var(--gold);padding:6px 16px;border-radius:99px;transition:.2s}
.pill:hover{background:var(--gold);color:var(--ink)}
.f{color:var(--dim)}
.f[aria-pressed=true]{color:var(--gold);text-decoration:underline;text-underline-offset:5px}
.view{position:fixed;inset:0;padding:max(clamp(26px,4vw,56px),env(safe-area-inset-top)) clamp(26px,6vw,88px) max(clamp(22px,3vw,44px),env(safe-area-inset-bottom));transition:opacity .4s}
#lv{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:14px 22px}
.hd{grid-column:1/-1;display:flex;align-items:center;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font:400 clamp(2rem,6vw,3.3rem)/1 "Merchant Copy",monospace;color:var(--gold)}
.sp{flex:1}
.sd{display:flex;flex-direction:column;align-items:flex-start;gap:.8rem;align-self:start;padding:6px 20px 0 0;border-right:1px solid var(--line);min-height:50%}
.sd .f{text-align:left}
.f small{font-size:11px;opacity:.7}
.mn{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0;min-width:0}
@media(max-width:640px){.nt{display:none}.pb{padding:6px 10px;font-size:12px}.pb.n{min-width:30px;padding:6px 0}.pgn{gap:.3rem;flex-wrap:wrap}.nm{-webkit-line-clamp:3;font-size:12px}.sd{padding-right:10px;gap:.9rem;font-size:12px}#lv{gap:12px 12px}.hd .pill{padding:4px 10px;font-size:12px}}

.cd:hover{transform:translateY(-4px);border-color:var(--gold)}
.ph{flex:none;aspect-ratio:1;position:relative;background:rgba(74,18,48,.7);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

.ph em.a{color:var(--gold)}

/* livros da amazon: {n:"título",c:"livros",s:"autor",p:49.9} (u: link do livro, i: foto) */
const L=[];
D.push(...L);
const OUT={
  papelaria:"constava sem estoque quando adicionei, mas acho que logo volta",
  beleza:"constava sem estoque quando adicionei, mas acho que logo volta",
  roupas:"meu tamanho constava sem estoque quando adicionei, mas acho que logo volta"
};
 
 const $=s=>document.querySelector(s),fmt=v=>v==null?"ver no link":"R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2});
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const img=d=>d.i||slug(d.n)+".jpg";
 const sizeLabel=d=>{
  const m=(d.x||"").match(/\b(tamanho|numeração)\s+([A-Za-z0-9]+)/i);
  if(!m)return "";
  return (m[1].toLowerCase()==="numeração"?"Numeração ":"Tamanho ")+m[2];
};
const cats=["tudo","roupas","calçados","beleza","papelaria","livros"];
let cat="tudo",pg=0,per=8,cur=[];
const EX=["jpg","jpeg","png","webp"];
function er(m){const k=(+m.dataset.k||0)+1;if(!m.dataset.b||k>=EX.length){m.remove();return}m.dataset.k=k;m.src=m.dataset.b+"."+EX[k]}
const ph=d=>{
  const b=img(d).replace(/\.jpg$/,"");
  const size=sizeLabel(d);
  return `<div class="ph"><svg><use href="#st"/></svg>${size?`<span class="size-badge photo-size">${size}</span>`:""}<img src="${img(d)}" data-b="${d.i?"":b}" alt="" onerror="er(this)"></div>`;
};const tabs=()=>cats.map(c=>{const n=D.filter(d=>c=="tudo"||d.c==c).length;return `<button class="f" data-c="${c}" aria-pressed="${c==cat}">${c}${n?` <small>${n}</small>`:""}</button>`}).join("")+`<small class="nt">preços e estoque mudam, confira no link</small>`;
const mq=()=>{const g=$("#gr"),w=g.clientWidth,h=g.clientHeight,gap=14;let cols=w<420?2:w<720?3:4,rows;
 for(;;){const cw=(w-gap*(cols-1))/cols;rows=Math.floor((h+gap)/(cw+78+gap));if(rows>=(w<720?1:2)||cols>=6)break;cols++}
 rows=Math.min(3,Math.max(1,rows));g.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;g.style.gridTemplateRows="";return cols*rows};
function draw(fade){
 per=mq();cur=D.filter(d=>cat=="tudo"||d.c==cat);
 const np=Math.max(1,Math.ceil(cur.length/per));pg=Math.min(pg,np-1);
 $("#tb").innerHTML=tabs();
 const g=$("#gr"),go=()=>{
  g.innerHTML=cur.length?cur.slice(pg*per,pg*per+per).map((d,i)=>`<button class="cd" data-i="${pg*per+i}">${ph(d)}<div class="in"><div class="nm">${d.n}</div><div class="pr">${fmt(d.p)}</div></div></button>`).join(""):
  `<div class="msg" style="grid-column:1/-1;grid-row:1/-1"><p>${cat=="livros"?"os livros aparecem aqui.":"nada por aqui."}</p><a class="pill" href="${WL}" target="_blank" rel="noopener">${cat=="livros"?"abrir lista na amazon":""}</a></div>`;
g.querySelectorAll(".ph").forEach((p,i)=>{const d=cur[pg*per+i];if(d&&d.o)p.insertAdjacentHTML("beforeend",`<em>${OUT[d.c]||OUT.papelaria}</em>`);else if(d&&d.a)p.insertAdjacentHTML("beforeend","<em class=\"a\">mais barato na Só Mega Promoções</em>")});  g.style.opacity=1};
 if(fade){g.style.opacity=0;setTimeout(go,200)}else go();
 $("#pn").innerHTML=np>1?`<button class="pb" id="pv"${pg==0?" disabled":""}>anterior</button>`+Array.from({length:np},(_,i)=>`<button class="pb n" data-p="${i}"${i==pg?' aria-current="page"':""}>${i+1}</button>`).join("")+`<button class="pb" id="nx"${pg>=np-1?" disabled":""}>próxima</button>`:"";
}
function open(d){
  const u=d.u||"https://www.google.com/search?q="+encodeURIComponent(d.s+" "+d.n);
  const m=$("#md");
  const size=sizeLabel(d);
  const extra=(d.x||"").replace(/\b(?:tamanho|numeração)\s+[A-Za-z0-9]+[,.]?\s*/i,"").trim();

  m.innerHTML=`
    <div class="pn">
      ${ph(d)}
      <div>
        <h2>${d.n}</h2>
        <div class="pr">${fmt(d.p)}</div>
        ${size?`<div class="size-badge detail-size">${size}</div>`:""}
        <p>${d.s}${extra?". "+extra:""}</p>
        ${d.o?`<p class="o">${OUT[d.c]||OUT.papelaria}</p>`:""}
        ${d.a?`<p class="av">${d.a}</p>`:""}
        <a href="${u}" target="_blank" rel="noopener">ver produto</a>
        <button class="f" id="cl">fechar</button>
      </div>
    </div>`;

  m.hidden=false;
  $("#cl").focus();
}
const close=()=>{$("#md").hidden=true};
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-c]");if(c){cat=c.dataset.c;pg=0;draw(0);return}
 const k=e.target.closest(".cd");if(k){open(cur[+k.dataset.i]);return}
 if(e.target.id=="md"||e.target.id=="cl")close();
 const pp=e.target.closest("[data-p]");if(pp){pg=+pp.dataset.p;draw(1);return}
 if(e.target.id=="pv"&&pg>0){pg--;draw(1)}
 if(e.target.id=="nx"){pg++;draw(1)}
 if(e.target.id=="rd"){const a=cur.length?cur:D;open(a[Math.floor(Math.random()*a.length)])}
});
addEventListener("keydown",e=>{if(e.key=="Escape")close();if(!$("#md").hidden)return;
 if(e.key=="ArrowLeft"&&pg>0){pg--;draw(1)}if(e.key=="ArrowRight"&&pg<Math.ceil(cur.length/per)-1){pg++;draw(1)}});
addEventListener("resize",()=>{draw(0)});
let sx=0;addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(!$("#md").hidden||Math.abs(d)<60)return;
 if(d<0&&pg<Math.ceil(cur.length/per)-1){pg++;draw(1)}if(d>0&&pg>0){pg--;draw(1)}},{passive:true});
draw(0);


</script>
