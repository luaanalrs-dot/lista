.veil{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 30% 25%,rgba(29,6,20,0),rgba(29,6,20,.5))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:2px 0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.pill{border:1px solid var(--gold);color:var(--gold);padding:6px 16px;border-radius:99px;transition:.2s}
.pill:hover{background:var(--gold);color:var(--ink)}
.f{color:var(--dim)}

.hd{grid-column:1/-1;display:flex;align-items:center;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font:400 clamp(2rem,6vw,3.3rem)/1 "Merchant Copy",monospace;color:var(--gold)}
.sp{flex:1}
.sd{display:flex;flex-direction:column;align-items:flex-start;gap:.8rem;align-self:start;padding:6px 20px 0 0;border-right:1px solid var(--line);min-height:50%}
.sd .f{text-align:left}
.f small{font-size:11px;opacity:.7}
.mn{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0;min-width:0}
@media(max-width:640px){.nt{display:none}.pb{padding:6px 10px;font-size:12px}.pb.n{min-width:30px;padding:6px 0}.pgn{gap:.3rem;flex-wrap:wrap}.nm{-webkit-line-clamp:3;font-size:12px}.sd{padding-right:10px;gap:.9rem;font-size:12px}#lv{gap:12px 12px}.hd .pill{padding:4px 10px;font-size:12px}}
#gr{display:grid;gap:14px;align-content:start;overflow:hidden;min-height:0;min-width:0;transition:opacity .22s}
.cd{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);background:rgba(29,6,20,.45);transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s}
.cd:hover{transform:translateY(-4px);border-color:var(--gold)}
.ph{flex:none;aspect-ratio:1;position:relative;background:rgba(74,18,48,.7);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ph svg{position:absolute;inset:0;margin:auto;width:22px;height:22px;fill:var(--gold);opacity:.7}
.ph em.a{color:var(--gold)}.ph em{position:absolute;left:0;bottom:0;right:0;background:rgba(29,6,20,.82);color:var(--rose);font-style:normal;font-size:11px;padding:2px 8px}
.in{padding:8px 10px 10px}
.nm{font-weight:700;font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font:400 1.4rem/1.1 "Merchant Copy",monospace;color:var(--gold)}
.pgn{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:.6rem;padding-top:14px;border-top:1px solid var(--line)}
.pb{border:1px solid var(--line);border-radius:99px;padding:6px 16px;color:var(--cream);transition:.2s}
.pb:hover{border-color:var(--gold);color:var(--gold)}
.pb[disabled]{opacity:.28;pointer-events:none}
.pb.n{min-width:36px;padding:6px 0;text-align:center}
.pb[aria-current=page]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.nt{margin-top:1.4rem;color:var(--dim);font-size:11px;max-width:13ch;line-height:1.45}
.msg{align-self:center;justify-self:center;text-align:center;display:grid;gap:1rem;justify-items:center;color:var(--dim)}
/* detalhe */
#md{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:18px;background:rgba(20,4,14,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#md[hidden]{display:none}
.pn{width:min(760px,100%);max-height:100%;display:grid;grid-template-columns:1fr 1fr;gap:22px;background:var(--ink);border:1px solid var(--line);padding:18px;overflow:auto}

.pn h2{font-size:16px;line-height:1.35}
.pn .pr{font-size:2.2rem;margin:.5rem 0}
.pn p{color:var(--dim);font-size:13px;margin-bottom:.7rem}
.pn p.o{color:var(--rose)}.pn p.av{color:var(--gold)}
.pn a{display:inline-block;color:var(--ink);background:var(--gold);padding:8px 20px;border-radius:99px;text-decoration:none;margin-right:1rem}
@media(max-width:640px){.pn{grid-template-columns:1fr}.pn>.ph{max-width:340px;justify-self:center;width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

let cat="tudo",pg=0,per=8,cur=[];
const EX=["jpg","jpeg","png","webp"];
function er(m){const k=(+m.dataset.k||0)+1;if(!m.dataset.b||k>=EX.length){m.remove();return}m.dataset.k=k;m.src=m.dataset.b+"."+EX[k]}
const ph=d=>{const b=img(d).replace(/\.jpg$/,"");return `<div class="ph"><svg><use href="#st"/></svg><img src="${img(d)}" data-b="${d.i?"":b}" alt="" onerror="er(this)"></div>`};
const tabs=()=>cats.map(c=>{const n=D.filter(d=>c=="tudo"||d.c==c).length;return `<button class="f" data-c="${c}" aria-pressed="${c==cat}">${c}${n?` <small>${n}</small>`:""}</button>`}).join("")+`<small class="nt">preços e estoque mudam, confira no link</small>`;
const mq=()=>{const g=$("#gr"),w=g.clientWidth,h=g.clientHeight,gap=14;let cols=w<420?2:w<720?3:4,rows;
 for(;;){const cw=(w-gap*(cols-1))/cols;rows=Math.floor((h+gap)/(cw+78+gap));if(rows>=(w<720?1:2)||cols>=6)break;cols++}
 rows=Math.min(3,Math.max(1,rows));g.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;g.style.gridTemplateRows="";return cols*rows};
function draw(fade){
 per=mq();cur=D.filter(d=>cat=="tudo"||d.c==cat);
 const np=Math.max(1,Math.ceil(cur.length/per));pg=Math.min(pg,np-1);
 $("#tb").innerHTML=tabs();
 const g=$("#gr"),go=()=>{
  g.innerHTML=cur.length?cur.slice(pg*per,pg*per+per).map((d,i)=>`<button class="cd" data-i="${pg*per+i}">${ph(d)}<div class="in"><div class="nm">${d.n}</div><div class="pr">${fmt(d.p)}</div></div></button>`).join(""):
  `<div class="msg" style="grid-column:1/-1;grid-row:1/-1"><p>${cat=="livros"?"os livros aparecem aqui.":"nada por aqui."}</p><a class="pill" href="${WL}" target="_blank" rel="noopener">${cat=="livros"?"abrir lista na amazon":""}</a></div>`;
  g.querySelectorAll(".ph").forEach((p,i)=>{const d=cur[pg*per+i];if(d&&d.o)p.insertAdjacentHTML("beforeend","<em>atualmente esgotado</em>");else if(d&&d.a)p.insertAdjacentHTML("beforeend","<em class=\"a\">mais barato em outra loja</em>")});
  g.style.opacity=1};
 if(fade){g.style.opacity=0;setTimeout(go,200)}else go();
 $("#pn").innerHTML=np>1?`<button class="pb" id="pv"${pg==0?" disabled":""}>anterior</button>`+Array.from({length:np},(_,i)=>`<button class="pb n" data-p="${i}"${i==pg?' aria-current="page"':""}>${i+1}</button>`).join("")+`<button class="pb" id="nx"${pg>=np-1?" disabled":""}>próxima</button>`:"";
}
function open(d){const u=d.u||"https://www.google.com/search?q="+encodeURIComponent(d.s+" "+d.n);
 const m=$("#md");m.innerHTML=`<div class="pn">${ph(d)}<div><h2>${d.n}</h2><div class="pr">${fmt(d.p)}</div><p>${d.s}${d.x?". "+d.x:""}</p>${d.o?`<p class="o">${OUT}</p>`:""}${d.a?`<p class="av">${d.a}</p>`:""}<a href="${u}" target="_blank" rel="noopener">ver produto</a><button class="f" id="cl">fechar</button></div></div>`;
 m.hidden=false;$("#cl").focus()}
const close=()=>{$("#md").hidden=true};
document.addEventListener("click",e=>{

 const k=e.target.closest(".cd");if(k){open(cur[+k.dataset.i]);return}
 if(e.target.id=="md"||e.target.id=="cl")close();
 const pp=e.target.closest("[data-p]");if(pp){pg=+pp.dataset.p;draw(1);return}
 if(e.target.id=="pv"&&pg>0){pg--;draw(1)}
 if(e.target.id=="nx"){pg++;draw(1)}
 if(e.target.id=="rd"){const a=cur.length?cur:D;open(a[Math.floor(Math.random()*a.length)])}
});
addEventListener("keydown",e=>{if(e.key=="Escape")close();if(!$("#md").hidden)return;

let sx=0;addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});

draw(0);
addEventListener("pointermove",e=>{$("#bg").style.transform=`translate(${(e.clientX/innerWidth-.5)*-22}px,${(e.clientY/innerHeight-.5)*-22}px)`});
